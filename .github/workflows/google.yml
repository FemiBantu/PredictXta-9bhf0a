# PredictXta — Google Cloud Run Deployment
# Builds Docker image and deploys to Cloud Run (europe-west1).
#
# Prerequisites (set as GitHub Actions secrets):
#   WORKLOAD_IDENTITY_PROVIDER  — Google Cloud Workload Identity Federation provider
#   GCP_SERVICE_ACCOUNT         — Service account email for deployment
#   GAR_LOCATION                — Artifact Registry region (e.g. europe-west1)
#   GCP_PROJECT_ID              — Google Cloud project ID
#   CLOUD_RUN_SERVICE           — Cloud Run service name (e.g. predictxta-api)
#   CLOUD_RUN_REGION            — Cloud Run region (e.g. europe-west1)
#   SUPABASE_URL                — Injected at runtime (not committed)
#   SUPABASE_ANON_KEY           — Injected at runtime (not committed)

name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GAR_LOCATION: ${{ secrets.GAR_LOCATION }}
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
  CLOUD_RUN_REGION: ${{ secrets.CLOUD_RUN_REGION }}
  IMAGE_NAME: predictxta-api

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          IMAGE_TAG="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build \
            --tag "${IMAGE_TAG}" \
            --build-arg GITHUB_SHA="${{ github.sha }}" \
            --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            .
          docker push "${IMAGE_TAG}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.CLOUD_RUN_SERVICE }}
          region: ${{ env.CLOUD_RUN_REGION }}
          image: ${{ env.IMAGE_TAG }}
          flags: |
            --allow-unauthenticated
            --port=3000
            --memory=512Mi
            --cpu=1
            --min-instances=1
            --max-instances=20
            --concurrency=100

      - name: Health check
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region=${{ env.CLOUD_RUN_REGION }} --format='value(status.url)')
          echo "Deployed to: $SERVICE_URL"
          curl -f "$SERVICE_URL/health" || echo "Health check endpoint not yet configured"
