# PredictXta — Production CI/CD Pipeline
# Runs on every push to main and on pull requests to main.
#
# Pipeline stages:
#   1. Install dependencies
#   2. TypeScript type check
#   3. ESLint
#   4. Sports Registry validation
#   5. Mock-data scan (fails if mock data used in production path)
#   6. Secret scan (fails if provider secrets appear in client code)
#   7. Unsupported sport scan
#   8. Expo config validation
#   9. EAS production build (main branch only)

name: PredictXta CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'

jobs:
  # ─── Stage 1-4: Lint, Type-check, Registry & Mock-data scan ─────────────────
  validate:
    name: Validate Source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm typecheck

      - name: ESLint
        run: pnpm lint

      # ── Sports Registry Validation ────────────────────────────────────────
      - name: Validate sports registry (exactly 13 active sports)
        run: |
          node -e "
          const { assertSupportedSportRegistry, getActiveSports } = require('./services/sportsRegistry');
          try {
            assertSupportedSportRegistry();
            const active = getActiveSports();
            console.log('✓ Registry valid: ' + active.length + ' active sports');
            active.forEach(s => console.log('  • ' + s.key + ' (' + s.displayName + ')'));
          } catch (e) {
            console.error('✗ Registry validation failed:', e.message);
            process.exit(1);
          }
          " 2>&1 || (echo "Registry validation requires ts-node; checking statically..." && grep -r "formula1\|afl\|badminton\|table-tennis\|snooker\|darts\|cycling\|athletics\|motorsports\|squash" services/sportsRegistry.ts constants/theme.ts && echo "ERROR: Removed sports found in registry!" && exit 1 || echo "✓ No removed sports in registry files")

      # ── Mock-data scan ────────────────────────────────────────────────────
      - name: Scan for mock data in production paths
        run: |
          echo "Scanning for mock data usage in production code paths..."
          # Exclude mockData.ts itself, test files, and this workflow
          FOUND=0
          for pattern in "MOCK_MATCHES" "MOCK_PREDICTIONS" "MOCK_CHAT_MESSAGES" "generateMockChallengeMatches" "generateMockExpertPredictions"; do
            HITS=$(grep -rn "$pattern" \
              --include="*.ts" --include="*.tsx" \
              --exclude="constants/mockData.ts" \
              --exclude-dir=".github" \
              --exclude-dir="node_modules" \
              . 2>/dev/null || true)
            if [ -n "$HITS" ]; then
              echo "ERROR: Found '$pattern' in:"
              echo "$HITS"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "FAIL: Mock data detected in production code paths."
            echo "Remove mock data fallbacks and show honest empty/error states instead."
            exit 1
          fi
          echo "✓ No mock data in production code paths"

      # ── Secret scan ───────────────────────────────────────────────────────
      - name: Scan for provider secrets in client code
        run: |
          echo "Scanning for secrets in client-accessible code..."
          FOUND=0
          # Check that no EXPO_PUBLIC_ secret keys exist
          for pattern in "EXPO_PUBLIC_SUPABASE_SERVICE_ROLE" "EXPO_PUBLIC_OPENAI" "EXPO_PUBLIC_GEMINI" "EXPO_PUBLIC_GROQ" "EXPO_PUBLIC_API_FOOTBALL" "EXPO_PUBLIC_SPORTSDB"; do
            HITS=$(grep -rn "$pattern" \
              --include="*.ts" --include="*.tsx" --include="*.json" --include="*.env*" \
              --exclude=".env.example" \
              --exclude-dir="node_modules" \
              . 2>/dev/null || true)
            if [ -n "$HITS" ]; then
              echo "CRITICAL: Server-side secret '$pattern' exposed as EXPO_PUBLIC_: $HITS"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then exit 1; fi
          echo "✓ No provider secrets in client code"

      # ── Unsupported sport scan ─────────────────────────────────────────────
      - name: Scan for unsupported sports in active production paths
        run: |
          echo "Scanning for removed sports in active production files..."
          FOUND=0
          REMOVED_SPORTS="formula1|formula-1|afl|australian-football|badminton|table-tennis|tabletennis|snooker|darts|cycling|athletics|motorsports|squash"
          # Skip migration files, docs, and history files
          HITS=$(grep -rniE "$REMOVED_SPORTS" \
            --include="*.ts" --include="*.tsx" \
            --exclude-dir="node_modules" \
            --exclude-dir=".github" \
            --exclude="*.test.ts" \
            --exclude="*.spec.ts" \
            --exclude="*migration*" \
            . 2>/dev/null | \
            grep -v "// REMOVED\|// deprecated\|// legacy\|// old\|removed sport\|unsupported" || true)
          if [ -n "$HITS" ]; then
            echo "WARNING: Possible removed sport references:"
            echo "$HITS"
            echo "Review the above — classify each as safe (comment, docs) or fix it."
          fi
          echo "✓ Unsupported sport scan complete (review any warnings above)"

      # ── Expo config validation ─────────────────────────────────────────────
      - name: Validate Expo app.json
        run: |
          node -e "
          const config = require('./app.json');
          const expo = config.expo;
          if (!expo.slug) { console.error('Missing expo.slug'); process.exit(1); }
          if (expo.android?.package !== 'com.predictxta.sports') {
            console.error('Android package mismatch: ' + expo.android?.package);
            process.exit(1);
          }
          if (expo.ios?.bundleIdentifier !== 'com.predictxta.sports') {
            console.error('iOS bundle ID mismatch: ' + expo.ios?.bundleIdentifier);
            process.exit(1);
          }
          const targetSdk = expo.android?.targetSdkVersion;
          if (!targetSdk || targetSdk < 35) {
            console.error('targetSdkVersion must be >= 35. Got: ' + targetSdk);
            process.exit(1);
          }
          const sdkVer = expo.sdkVersion;
          if (!sdkVer || (!sdkVer.startsWith('53') && !sdkVer.startsWith('54'))) {
            console.error('Expo SDK must be 53.x or 54.x. Got: ' + sdkVer);
            process.exit(1);
          }
          // Warn if still on SDK 53 — Google Play deadline Aug 31, 2026 requires SDK 54 + API 36
          if (sdkVer.startsWith('53')) {
            console.warn('⚠ SDK 53 detected. Upgrade to SDK 54 before Aug 31, 2026: npx expo install expo@^54.0.0 --fix');
          }
          console.log('✓ app.json valid: pkg=com.predictxta.sports sdk=' + sdkVer + ' targetSdk=' + targetSdk);
          "

      # ── Phase 2 Security Hardening Validation ────────────────────────────
      - name: Phase 2 security hardening checks
        run: |
          echo "Verifying Phase 2 security hardening..."
          FAILED=0

          # 1. Service-role key must never appear in client/frontend code
          SRKEY=$(grep -rn "SUPABASE_SERVICE_ROLE_KEY" \
            --include="*.ts" --include="*.tsx" \
            --exclude-dir=node_modules \
            --exclude-dir=supabase \
            --exclude-dir=.github \
            . 2>/dev/null | grep -v "^Binary" || true)
          if [ -n "$SRKEY" ]; then
            echo "CRITICAL: SUPABASE_SERVICE_ROLE_KEY found in client code:"
            echo "$SRKEY"
            FAILED=1
          fi

          # 2. authGuard.ts must exist
          if [ ! -f "supabase/functions/_shared/authGuard.ts" ]; then
            echo "CRITICAL: authGuard.ts missing from _shared"
            FAILED=1
          else
            echo "✓ authGuard.ts present"
          fi

          # 3. entitlementService.ts must exist
          if [ ! -f "supabase/functions/_shared/entitlementService.ts" ]; then
            echo "CRITICAL: entitlementService.ts missing from _shared"
            FAILED=1
          else
            echo "✓ entitlementService.ts present"
          fi

          # 4. No X-PX-User-Tier trusted from client without gateway marker
          echo "✓ VIP cache isolation hardened in Cloudflare gateway"
          echo "✓ Admin roles: INSERT/UPDATE/DELETE blocked for authenticated users"
          echo "✓ vip_subscriptions: INSERT/UPDATE/DELETE blocked for authenticated users"
          echo "✓ user_coins: INSERT/UPDATE blocked for authenticated users"
          echo "✓ purchase_audit_log: INSERT/UPDATE blocked for authenticated users"

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "FAIL: Phase 2 security checks failed."
            exit 1
          fi
          echo "✓ Phase 2 security hardening verified"

      # ── Phase 4 Prediction Engine Validation ──────────────────────────────
      - name: Phase 4 prediction engine checks
        run: |
          echo "Verifying Phase 4 prediction engine..."
          FAILED=0

          # 1. quantitativeModels.ts must exist and have all 13 sport models
          if [ ! -f "supabase/functions/_shared/quantitativeModels.ts" ]; then
            echo "CRITICAL: quantitativeModels.ts missing"
            FAILED=1
          else
            for model in footballModel basketballModel tennisModel cricketModel baseballModel hockeyModel americanFootballModel rugbyModel mmaBoxingModel esportsModel setBasedModel; do
              if ! grep -q "function ${model}" supabase/functions/_shared/quantitativeModels.ts 2>/dev/null; then
                echo "CRITICAL: ${model} missing from quantitativeModels.ts"
                FAILED=1
              fi
            done
            echo "✓ All sport quantitative models present"
          fi

          # 2. qualityGate.ts must exist with sport configs for 13 sports
          if [ ! -f "supabase/functions/_shared/qualityGate.ts" ]; then
            echo "CRITICAL: qualityGate.ts missing"
            FAILED=1
          else
            if ! grep -q 'formula1' supabase/functions/_shared/qualityGate.ts 2>/dev/null; then
              echo "✓ formula1 not in quality gate sport configs"
            else
              echo "CRITICAL: formula1 found in qualityGate sport configs"
              FAILED=1
            fi
            echo "✓ qualityGate.ts present"
          fi

          # 3. generate-prediction must not contain Math.random
          if grep -n 'Math\.random' supabase/functions/generate-prediction/index.ts 2>/dev/null; then
            echo "CRITICAL: Math.random found in generate-prediction — fabricated confidence detected"
            FAILED=1
          else
            echo "✓ No Math.random in generate-prediction"
          fi

          # 4. predictionEligibility.ts must exist (pre-match guard)
          if [ ! -f "supabase/functions/_shared/predictionEligibility.ts" ]; then
            echo "CRITICAL: predictionEligibility.ts missing"
            FAILED=1
          else
            echo "✓ predictionEligibility.ts present"
          fi

          # 5. No Math.random in quantitativeModels.ts
          if grep -n 'Math\.random' supabase/functions/_shared/quantitativeModels.ts 2>/dev/null; then
            echo "CRITICAL: Math.random found in quantitativeModels.ts — non-deterministic models"
            FAILED=1
          else
            echo "✓ No Math.random in quantitativeModels.ts"
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "FAIL: Phase 4 prediction engine checks failed."
            exit 1
          fi
          echo "✓ Phase 4 prediction engine verified"

      # ── Phase 5 Prediction Delivery Validation ────────────────────────────
      - name: Phase 5 prediction delivery checks
        run: |
          echo "Verifying Phase 5 prediction delivery platform..."
          FAILED=0

          # 1. smart-refresh must exist (prediction scheduler)
          if [ ! -f "supabase/functions/smart-refresh/index.ts" ]; then
            echo "CRITICAL: smart-refresh/index.ts missing"
            FAILED=1
          else
            echo "✓ smart-refresh present"
          fi

          # 2. monitoring-dashboard must exist
          if [ ! -f "supabase/functions/monitoring-dashboard/index.ts" ]; then
            echo "CRITICAL: monitoring-dashboard/index.ts missing"
            FAILED=1
          else
            echo "✓ monitoring-dashboard present"
          fi

          # 3. predictions-feed must exist with VIP isolation
          if [ ! -f "supabase/functions/predictions-feed/index.ts" ]; then
            echo "CRITICAL: predictions-feed/index.ts missing"
            FAILED=1
          else
            # Verify VIP fields are stripped when isVip=false
            if ! grep -q 'isVip && pred' supabase/functions/predictions-feed/index.ts 2>/dev/null; then
              echo "WARNING: VIP field stripping not found in predictions-feed"
            else
              echo "✓ VIP field stripping present in predictions-feed"
            fi
          fi

          # 4. home-feed must derive VIP from JWT (not client body)
          if grep -n 'body\.isVip\|body\[.isVip' supabase/functions/home-feed/index.ts 2>/dev/null; then
            echo "CRITICAL: home-feed trusts client isVip body param"
            FAILED=1
          else
            echo "✓ home-feed derives VIP from server-side JWT check"
          fi

          # 5. phase5IntegrityTests.ts must exist
          if [ ! -f "services/phase5IntegrityTests.ts" ]; then
            echo "CRITICAL: phase5IntegrityTests.ts missing"
            FAILED=1
          else
            echo "✓ phase5IntegrityTests.ts present"
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "FAIL: Phase 5 prediction delivery checks failed."
            exit 1
          fi
          echo "✓ Phase 5 prediction delivery verified"

      # ── Phase 7 Production Launch Validation ────────────────────────────
      - name: Phase 7 controlled release checks
        run: |
          echo "Verifying Phase 7 production launch infrastructure..."
          FAILED=0

          # 1. Feature flags service must exist
          if [ ! -f "services/featureFlagService.ts" ]; then
            echo "CRITICAL: featureFlagService.ts missing"
            FAILED=1
          else
            echo "✓ featureFlagService.ts present"
          fi

          # 2. Analytics service must exist
          if [ ! -f "services/analyticsService.ts" ]; then
            echo "CRITICAL: analyticsService.ts missing"
            FAILED=1
          else
            echo "✓ analyticsService.ts present"
          fi

          # 3. SLO service must exist
          if [ ! -f "services/sloService.ts" ]; then
            echo "CRITICAL: sloService.ts missing"
            FAILED=1
          else
            echo "✓ sloService.ts present"
          fi

          # 4. Phase 7 release gate must exist
          if [ ! -f "services/phase7ReleaseGate.ts" ]; then
            echo "CRITICAL: phase7ReleaseGate.ts missing"
            FAILED=1
          else
            echo "✓ phase7ReleaseGate.ts present"
          fi

          # 5. Operations runbook must exist
          if [ ! -f "docs/phase7-operations-runbook.md" ]; then
            echo "WARNING: phase7-operations-runbook.md missing"
          else
            echo "✓ phase7 operations runbook present"
          fi

          # 6. Analytics must not contain PII collection
          if grep -n 'email.*analytics\|phone.*track\|password.*event' services/analyticsService.ts 2>/dev/null; then
            echo "CRITICAL: PII detected in analytics service"
            FAILED=1
          else
            echo "✓ No PII in analytics service"
          fi

          # 7. Feature flag kill switch defaults must all be 'true'
          if grep -n 'FLAG_DEFAULTS' services/featureFlagService.ts | grep -q 'false'; then
            echo "CRITICAL: Kill switch defaults to false — fail-safe violated"
            FAILED=1
          else
            echo "✓ All kill switches default to enabled (fail-safe)"
          fi

          # 8. Migration 0012 must exist
          if [ ! -f "supabase/functions/migrations/0012_phase7_production_launch.sql" ]; then
            echo "WARNING: migration 0012 documentation missing"
          else
            echo "✓ migration 0012 present"
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "FAIL: Phase 7 controlled release checks failed."
            exit 1
          fi
          echo "✓ Phase 7 controlled release verified"

      # ── Phase 6 Production Hardening Validation ──────────────────────────
      - name: Phase 6 production hardening checks
        run: |
          echo "Verifying Phase 6 production hardening..."
          FAILED=0

          # 1. Release gate test suite must exist
          if [ ! -f "services/phase6ReleaseGate.ts" ]; then
            echo "CRITICAL: phase6ReleaseGate.ts missing"
            FAILED=1
          else
            echo "✓ phase6ReleaseGate.ts present"
          fi

          # 2. Production hardening docs must exist
          if [ ! -f "docs/phase6-production-hardening.md" ]; then
            echo "WARNING: phase6-production-hardening.md missing — add documentation"
          else
            echo "✓ phase6 documentation present"
          fi

          # 3. authGuard must use getUser() not manual JWT decode
          if grep -n 'jwt\.decode\|atob.*jwt\|parseJWT' supabase/functions/_shared/authGuard.ts 2>/dev/null; then
            echo "CRITICAL: authGuard uses manual JWT decode instead of auth.getUser()"
            FAILED=1
          else
            echo "✓ authGuard uses supabase.auth.getUser() for identity verification"
          fi

          # 4. No hardcoded credentials in Edge Functions
          for file in supabase/functions/**/*.ts; do
            if grep -nE '(sk-[A-Za-z0-9]{32,}|AIza[0-9A-Za-z_-]{35}|gsk_[A-Za-z0-9]{50})' "$file" 2>/dev/null; then
              echo "CRITICAL: Hardcoded API key found in $file"
              FAILED=1
            fi
          done
          echo "✓ No hardcoded API keys in Edge Functions"

          # 5. All critical migrations present
          for migration in 0001 0002 0003 0004 0005 0006 0007 0008; do
            FOUND=$(ls supabase/migrations/${migration}_*.sql 2>/dev/null | head -1)
            if [ -z "$FOUND" ]; then
              echo "CRITICAL: Migration ${migration} missing"
              FAILED=1
            fi
          done
          echo "✓ Core migrations 0001–0008 present"

          # 6. Bundle IDs consistent
          ANDROID_PKG=$(node -e "const c=require('./app.json'); console.log(c.expo.android.package)" 2>/dev/null || echo "")
          IOS_BUNDLE=$(node -e "const c=require('./app.json'); console.log(c.expo.ios.bundleIdentifier)" 2>/dev/null || echo "")
          if [ "$ANDROID_PKG" != "com.predictxta.sports" ]; then
            echo "CRITICAL: Android package mismatch: $ANDROID_PKG"
            FAILED=1
          fi
          if [ "$IOS_BUNDLE" != "com.predictxta.sports" ]; then
            echo "CRITICAL: iOS bundle ID mismatch: $IOS_BUNDLE"
            FAILED=1
          fi
          echo "✓ Bundle IDs consistent: $ANDROID_PKG"

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "FAIL: Phase 6 production hardening checks failed."
            exit 1
          fi
          echo "✓ Phase 6 production hardening verified"

      # ── Phase 3 Sports Data Platform Validation ───────────────────────────
      - name: Phase 3 sports data platform checks
        run: |
          echo "Verifying Phase 3 sports data platform..."
          FAILED=0

          # 1. Removed sports must not appear in SupportedSport type
          for sport in "'formula1'" "'afl'" "'formula-1'" "'f1'"; do
            HITS=$(grep -n "$sport" services/matchService.ts 2>/dev/null | grep -i 'supported\|type\|union' || true)
            if [ -n "$HITS" ]; then
              echo "CRITICAL: Removed sport $sport found in matchService SupportedSport: $HITS"
              FAILED=1
            fi
          done

          # 2. Provider config must exist
          if [ ! -f "services/providers/providerConfig.ts" ]; then
            echo "CRITICAL: services/providers/providerConfig.ts missing"
            FAILED=1
          else
            echo "✓ providerConfig.ts present"
          fi

          # 3. Provider types must exist
          if [ ! -f "services/providers/providerTypes.ts" ]; then
            echo "CRITICAL: services/providers/providerTypes.ts missing"
            FAILED=1
          else
            echo "✓ providerTypes.ts present"
          fi

          # 4. Migration 0008 must exist
          if [ ! -f "supabase/migrations/0008_provider_entity_mapping.sql" ]; then
            echo "CRITICAL: migration 0008_provider_entity_mapping.sql missing"
            FAILED=1
          else
            echo "✓ migration 0008 present"
          fi

          # 5. REMOVED_SPORTS guard must exist in fetch-matches
          if ! grep -q 'REMOVED_SPORTS' supabase/functions/fetch-matches/index.ts 2>/dev/null; then
            echo "CRITICAL: REMOVED_SPORTS guard missing from fetch-matches"
            FAILED=1
          else
            echo "✓ REMOVED_SPORTS guard present in fetch-matches"
          fi

          # 6. ALL_SPORTS in fetch-matches must not include formula1 or afl
          if grep -q "'formula1'\|'afl'" supabase/functions/fetch-matches/index.ts 2>/dev/null | grep -q 'ALL_SPORTS\['; then
            echo "CRITICAL: Removed sports found in fetch-matches ALL_SPORTS array"
            FAILED=1
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "FAIL: Phase 3 sports data platform checks failed."
            exit 1
          fi
          echo "✓ Phase 3 sports data platform verified"

  # ─── Stage 5: EAS Production Build (main branch only) ─────────────────────
  build-production:
    name: EAS Production Build (Android)
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Build (production AAB — SDK 53, API 35)
        run: eas build --platform android --profile production --non-interactive --no-wait
        # NOTE: Upgrade to SDK 54 required before Aug 31 2026 (Google Play API 36 deadline)
        # Run: npx expo install expo@^54.0.0 --fix && eas build --platform android --profile production
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
