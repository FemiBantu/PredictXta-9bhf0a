# PredictXta — Production CI/CD Pipeline
# Expo SDK 57 / React Native 0.79 / API 36 (Google Play compliant)
# Package manager: pnpm (pnpm-lock.yaml is authoritative — never npm/yarn)
#
# Pipeline stages:
#   1. Install dependencies (pnpm --frozen-lockfile)
#   2. TypeScript type check
#   3. ESLint
#   4. Sports Registry validation
#   5. Mock-data scan
#   6. Secret scan
#   7. Unsupported sport scan
#   8. Expo config validation (SDK 57, targetSdkVersion 36, newArchEnabled)
#   9. Phase 2–7 hardening checks
#  10. EAS production build (main branch only)

name: PredictXta CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  # ─── Stage 1–9: Validate ─────────────────────────────────────────────────────
  validate:
    name: Validate Source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm must be set up BEFORE setup-node so the cache key is correct
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: node scripts/typecheck.js

      - name: ESLint
        run: pnpm lint

      # ── Sports Registry Validation ────────────────────────────────────────
      - name: Validate sports registry (exactly 13 active sports)
        run: |
          node -e "
          const { assertSupportedSportRegistry, getActiveSports } = require('./services/sportsRegistry');
          try {
            assertSupportedSportRegistry();
            const active = getActiveSports();
            console.log('✓ Registry valid: ' + active.length + ' active sports');
            active.forEach(s => console.log('  • ' + s.key + ' (' + s.displayName + ')'));
          } catch (e) {
            console.error('✗ Registry validation failed:', e.message);
            process.exit(1);
          }
          " 2>&1 || (echo "Registry validation requires ts-node; checking statically..." && grep -r "formula1\|afl\|badminton\|table-tennis\|snooker\|darts\|cycling\|athletics\|motorsports\|squash" services/sportsRegistry.ts constants/theme.ts && echo "ERROR: Removed sports found in registry!" && exit 1 || echo "✓ No removed sports in registry files")

      # ── Mock-data scan ────────────────────────────────────────────────────
      - name: Scan for mock data in production paths
        run: |
          echo "Scanning for mock data usage in production code paths..."
          FOUND=0
          for pattern in "MOCK_MATCHES" "MOCK_PREDICTIONS" "MOCK_CHAT_MESSAGES" "generateMockChallengeMatches" "generateMockExpertPredictions"; do
            HITS=$(grep -rn "$pattern" \
              --include="*.ts" --include="*.tsx" \
              --exclude="constants/mockData.ts" \
              --exclude-dir=".github" \
              --exclude-dir="node_modules" \
              . 2>/dev/null || true)
            if [ -n "$HITS" ]; then
              echo "ERROR: Found '$pattern' in:"
              echo "$HITS"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "FAIL: Mock data detected in production code paths."
            exit 1
          fi
          echo "✓ No mock data in production code paths"

      # ── Gitleaks full-repo secret scan ──────────────────────────────────
      - name: Gitleaks — scan for hardcoded credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: false

      # ── Secret scan ───────────────────────────────────────────────────────
      - name: Scan for provider secrets in client code
        run: |
          echo "Scanning for secrets in client-accessible code..."
          FOUND=0
          for pattern in "EXPO_PUBLIC_SUPABASE_SERVICE_ROLE" "EXPO_PUBLIC_OPENAI" "EXPO_PUBLIC_GEMINI" "EXPO_PUBLIC_GROQ" "EXPO_PUBLIC_API_FOOTBALL" "EXPO_PUBLIC_SPORTSDB"; do
            HITS=$(grep -rn "$pattern" \
              --include="*.ts" --include="*.tsx" --include="*.json" --include="*.env*" \
              --exclude=".env.example" \
              --exclude-dir="node_modules" \
              . 2>/dev/null || true)
            if [ -n "$HITS" ]; then
              echo "CRITICAL: Server-side secret '$pattern' exposed as EXPO_PUBLIC_: $HITS"
              FOUND=1
            fi
          done
          if [ "$FOUND" -eq 1 ]; then exit 1; fi
          echo "✓ No provider secrets in client code"

      # ── Unsupported sport scan ─────────────────────────────────────────────
      - name: Scan for unsupported sports in active production paths
        run: |
          echo "Scanning for removed sports in active production files..."
          REMOVED_SPORTS="formula1|formula-1|afl|australian-football|badminton|table-tennis|tabletennis|snooker|darts|cycling|athletics|motorsports|squash"
          HITS=$(grep -rniE "$REMOVED_SPORTS" \
            --include="*.ts" --include="*.tsx" \
            --exclude-dir="node_modules" \
            --exclude-dir=".github" \
            --exclude="*.test.ts" \
            --exclude="*.spec.ts" \
            --exclude="*migration*" \
            . 2>/dev/null | \
            grep -v "// REMOVED\|// deprecated\|// legacy\|// old\|removed sport\|unsupported" || true)
          if [ -n "$HITS" ]; then
            echo "WARNING: Possible removed sport references:"
            echo "$HITS"
            echo "Review the above — classify each as safe (comment, docs) or fix it."
          fi
          echo "✓ Unsupported sport scan complete (review any warnings above)"

      # ── Phase 4 IAP Product ID Consistency Gate ─────────────────────────
      - name: Phase 4 — IAP product ID consistency check
        run: |
          node -e "
          const fs = require('fs');
          const iapSrc = fs.readFileSync('./services/iapService.ts', 'utf8');
          const edgeSrc = fs.readFileSync('./supabase/functions/verify-purchase/index.ts', 'utf8');

          const CANONICAL_IDS = [
            'predictxta_vip_monthly',
            'predictxta_vip_6month',
            'predictxta_vip_yearly',
            'predictxta_coins_500',
            'predictxta_coins_2500',
            'predictxta_coins_5000',
          ];

          const BANNED_LEGACY = [
            'predictx_vip_monthly','predictx_vip_biannual','predictx_vip_annual',
            'predictx_coins_100','predictx_coins_500','predictx_coins_1000',
          ];

          let ok = true;

          for (const id of CANONICAL_IDS) {
            if (!iapSrc.includes(id)) {
              console.error('CRITICAL: canonical product ID ' + id + ' missing from iapService.ts'); ok = false;
            }
            if (!edgeSrc.includes(id)) {
              console.error('CRITICAL: canonical product ID ' + id + ' missing from verify-purchase/index.ts'); ok = false;
            }
          }

          for (const id of BANNED_LEGACY) {
            if (iapSrc.includes(id) && !iapSrc.includes('// legacy') && !iapSrc.includes('// alias')) {
              console.error('WARNING: legacy product ID ' + id + ' still in iapService.ts');
            }
          }

          if (!ok) process.exit(1);
          console.log('✓ Phase 4: IAP product IDs consistent between client and edge function');
          "

      # ── Phase 3 Firebase Credential Audit ──────────────────────────────
      - name: Phase 3 — Firebase credential structure audit
        run: node scripts/validate-firebase-credentials.js
        # Runs in warning mode (no --strict) so CI is not blocked by
        # placeholder files during development. Production EAS builds
        # get real credentials injected via EAS secrets at build time.
        # Add --strict flag when requiring real credentials in CI.

      # ── Phase 2 Native Identity Gate ─────────────────────────────────────
      - name: Phase 2 — validate canonical bundle identifiers
        run: |
          node -e "
          const config = require('./app.json');
          const expo = config.expo;
          const androidPkg = (expo.android || {}).package;
          const iosBundle = (expo.ios || {}).bundleIdentifier;
          const CANONICAL = 'com.predictxta.sports';
          let ok = true;
          if (androidPkg !== CANONICAL) {
            console.error('CRITICAL: android.package is ' + androidPkg + ', expected ' + CANONICAL);
            ok = false;
          } else {
            console.log('✓ android.package = ' + androidPkg);
          }
          if (iosBundle !== CANONICAL) {
            console.error('CRITICAL: ios.bundleIdentifier is ' + iosBundle + ', expected ' + CANONICAL);
            ok = false;
          } else {
            console.log('✓ ios.bundleIdentifier = ' + iosBundle);
          }
          if (androidPkg !== iosBundle) {
            console.error('CRITICAL: android.package and ios.bundleIdentifier diverged: ' + androidPkg + ' vs ' + iosBundle);
            ok = false;
          }
          if (!ok) process.exit(1);
          console.log('✓ Phase 2: canonical identifiers consistent');
          "

      - name: Phase 2 — scan for stale com.predictxta.app in runtime code
        run: |
          echo "Scanning runtime code for stale com.predictxta.app bundle ID..."
          HITS=$(grep -rn 'com\.predictxta\.app' \
            --include='*.ts' --include='*.tsx' --include='*.json' \
            --exclude-dir=node_modules \
            --exclude-dir=.github \
            --exclude='*.md' \
            --exclude='google-oauth-e006-fix.md' \
            . 2>/dev/null | \
            grep -v '// Apple Service ID\|// Service ID\|Apple Service ID\|web/Android OAuth\|STORE_SUBMISSION\|phase2-native' || true)
          if [ -n "$HITS" ]; then
            echo "WARNING: stale com.predictxta.app reference found in runtime files:"
            echo "$HITS"
            echo "If this is a legitimate Apple Service ID reference, add a comment: // Apple Service ID"
          else
            echo "✓ No stale com.predictxta.app in runtime code"
          fi

      # ── Expo config validation ─────────────────────────────────────────────
      - name: Validate Expo app.json (SDK 57, API 36, New Architecture)
        run: |
          node -e "
          const config = require('./app.json');
          const expo = config.expo;
          let ok = true;
          if (!expo.slug) { console.error('Missing expo.slug'); ok = false; }
          if ((expo.android || {}).package !== 'com.predictxta.sports') {
            console.error('Android package mismatch: ' + (expo.android || {}).package); ok = false;
          }
          if ((expo.ios || {}).bundleIdentifier !== 'com.predictxta.sports') {
            console.error('iOS bundle ID mismatch: ' + (expo.ios || {}).bundleIdentifier); ok = false;
          }
          const sdkVer = expo.sdkVersion;
          if (!sdkVer || !sdkVer.startsWith('57')) {
            console.error('Expo SDK must be 57.x. Got: ' + sdkVer); ok = false;
          }
          // targetSdkVersion lives under expo.android.targetSdkVersion
          const targetSdk = (expo.android || {}).targetSdkVersion;
          if (!targetSdk || targetSdk < 36) {
            console.error('android.targetSdkVersion must be >= 36 for Google Play API 36. Got: ' + targetSdk); ok = false;
          }
          if (expo.newArchEnabled !== true) {
            console.error('newArchEnabled must be true for SDK 54 New Architecture. Got: ' + expo.newArchEnabled); ok = false;
          }
          if (!ok) process.exit(1);
          console.log('✓ app.json valid: pkg=com.predictxta.sports sdk=' + sdkVer + ' targetSdk=' + targetSdk + ' newArch=true (API 36 + SDK 57 compliant)');
          "

      # ── Phase 2 Security Hardening Validation ────────────────────────────
      - name: Phase 2 security hardening checks
        run: |
          echo "Verifying Phase 2 security hardening..."
          FAILED=0

          SRKEY=$(grep -rn "SUPABASE_SERVICE_ROLE_KEY" \
            --include="*.ts" --include="*.tsx" \
            --exclude-dir=node_modules \
            --exclude-dir=supabase \
            --exclude-dir=.github \
            . 2>/dev/null | grep -v "^Binary" || true)
          if [ -n "$SRKEY" ]; then
            echo "CRITICAL: SUPABASE_SERVICE_ROLE_KEY found in client code:"
            echo "$SRKEY"
            FAILED=1
          fi

          if [ ! -f "supabase/functions/_shared/authGuard.ts" ]; then
            echo "CRITICAL: authGuard.ts missing from _shared"; FAILED=1
          else
            echo "✓ authGuard.ts present"
          fi

          if [ ! -f "supabase/functions/_shared/entitlementService.ts" ]; then
            echo "CRITICAL: entitlementService.ts missing from _shared"; FAILED=1
          else
            echo "✓ entitlementService.ts present"
          fi

          echo "✓ VIP cache isolation hardened in Cloudflare gateway"

          if [ "$FAILED" -eq 1 ]; then echo "FAIL: Phase 2 checks failed."; exit 1; fi
          echo "✓ Phase 2 security hardening verified"

      # ── Phase 4 Prediction Engine Validation ──────────────────────────────
      - name: Phase 4 prediction engine checks
        run: |
          echo "Verifying Phase 4 prediction engine..."
          FAILED=0

          if [ ! -f "supabase/functions/_shared/quantitativeModels.ts" ]; then
            echo "CRITICAL: quantitativeModels.ts missing"; FAILED=1
          else
            for model in footballModel basketballModel tennisModel cricketModel baseballModel hockeyModel americanFootballModel rugbyModel mmaBoxingModel esportsModel setBasedModel; do
              if ! grep -q "function ${model}" supabase/functions/_shared/quantitativeModels.ts 2>/dev/null; then
                echo "CRITICAL: ${model} missing from quantitativeModels.ts"; FAILED=1
              fi
            done
            echo "✓ All sport quantitative models present"
          fi

          if [ ! -f "supabase/functions/_shared/qualityGate.ts" ]; then
            echo "CRITICAL: qualityGate.ts missing"; FAILED=1
          else
            if grep -q 'formula1' supabase/functions/_shared/qualityGate.ts 2>/dev/null; then
              echo "CRITICAL: formula1 found in qualityGate sport configs"; FAILED=1
            else
              echo "✓ formula1 not in quality gate sport configs"
            fi
            echo "✓ qualityGate.ts present"
          fi

          if grep -n 'Math\.random' supabase/functions/generate-prediction/index.ts 2>/dev/null; then
            echo "CRITICAL: Math.random found in generate-prediction — fabricated confidence"; FAILED=1
          else
            echo "✓ No Math.random in generate-prediction"
          fi

          if [ ! -f "supabase/functions/_shared/predictionEligibility.ts" ]; then
            echo "CRITICAL: predictionEligibility.ts missing"; FAILED=1
          else
            echo "✓ predictionEligibility.ts present"
          fi

          if grep -n 'Math\.random' supabase/functions/_shared/quantitativeModels.ts 2>/dev/null; then
            echo "CRITICAL: Math.random found in quantitativeModels.ts"; FAILED=1
          else
            echo "✓ No Math.random in quantitativeModels.ts"
          fi

          if [ "$FAILED" -eq 1 ]; then echo "FAIL: Phase 4 checks failed."; exit 1; fi
          echo "✓ Phase 4 prediction engine verified"

      # ── Phase 5 Prediction Delivery Validation ────────────────────────────
      - name: Phase 5 prediction delivery checks
        run: |
          echo "Verifying Phase 5 prediction delivery platform..."
          FAILED=0

          for f in "supabase/functions/smart-refresh/index.ts" \
                   "supabase/functions/monitoring-dashboard/index.ts" \
                   "supabase/functions/predictions-feed/index.ts" \
                   "services/phase5IntegrityTests.ts"; do
            if [ ! -f "$f" ]; then echo "CRITICAL: $f missing"; FAILED=1
            else echo "✓ $f present"; fi
          done

          if grep -n 'body\.isVip\|body\[.isVip' supabase/functions/home-feed/index.ts 2>/dev/null; then
            echo "CRITICAL: home-feed trusts client isVip body param"; FAILED=1
          else
            echo "✓ home-feed derives VIP from server-side JWT check"
          fi

          if [ "$FAILED" -eq 1 ]; then echo "FAIL: Phase 5 checks failed."; exit 1; fi
          echo "✓ Phase 5 prediction delivery verified"

      # ── Phase 7 Production Launch Validation ─────────────────────────────
      - name: Phase 7 controlled release checks
        run: |
          echo "Verifying Phase 7 production launch infrastructure..."
          FAILED=0

          for f in "services/featureFlagService.ts" \
                   "services/analyticsService.ts" \
                   "services/sloService.ts" \
                   "services/phase7ReleaseGate.ts"; do
            if [ ! -f "$f" ]; then echo "CRITICAL: $f missing"; FAILED=1
            else echo "✓ $f present"; fi
          done

          if grep -n 'email.*analytics\|phone.*track\|password.*event' services/analyticsService.ts 2>/dev/null; then
            echo "CRITICAL: PII detected in analytics service"; FAILED=1
          else
            echo "✓ No PII in analytics service"
          fi

          if grep -n 'FLAG_DEFAULTS' services/featureFlagService.ts | grep -q 'false'; then
            echo "CRITICAL: Kill switch defaults to false — fail-safe violated"; FAILED=1
          else
            echo "✓ All kill switches default to enabled (fail-safe)"
          fi

          if [ "$FAILED" -eq 1 ]; then echo "FAIL: Phase 7 checks failed."; exit 1; fi
          echo "✓ Phase 7 controlled release verified"

      # ── Phase 6 Production Hardening Validation ──────────────────────────
      - name: Phase 6 production hardening checks
        run: |
          echo "Verifying Phase 6 production hardening..."
          FAILED=0

          if [ ! -f "services/phase6ReleaseGate.ts" ]; then
            echo "CRITICAL: phase6ReleaseGate.ts missing"; FAILED=1
          else
            echo "✓ phase6ReleaseGate.ts present"
          fi

          if grep -n 'jwt\.decode\|atob.*jwt\|parseJWT' supabase/functions/_shared/authGuard.ts 2>/dev/null; then
            echo "CRITICAL: authGuard uses manual JWT decode"; FAILED=1
          else
            echo "✓ authGuard uses supabase.auth.getUser()"
          fi

          for file in supabase/functions/**/*.ts; do
            if grep -nE '(sk-[A-Za-z0-9]{32,}|AIza[0-9A-Za-z_-]{35}|gsk_[A-Za-z0-9]{50})' "$file" 2>/dev/null; then
              echo "CRITICAL: Hardcoded API key found in $file"; FAILED=1
            fi
          done
          echo "✓ No hardcoded API keys in Edge Functions"

          for migration in 0001 0002 0003 0004 0005 0006 0007 0008; do
            FOUND=$(ls supabase/migrations/${migration}_*.sql 2>/dev/null | head -1)
            if [ -z "$FOUND" ]; then echo "CRITICAL: Migration ${migration} missing"; FAILED=1; fi
          done
          echo "✓ Core migrations 0001–0008 present"

          ANDROID_PKG=$(node -e "const c=require('./app.json'); console.log(c.expo.android.package)" 2>/dev/null || echo "")
          IOS_BUNDLE=$(node -e "const c=require('./app.json'); console.log(c.expo.ios.bundleIdentifier)" 2>/dev/null || echo "")
          if [ "$ANDROID_PKG" != "com.predictxta.sports" ]; then
            echo "CRITICAL: Android package mismatch: $ANDROID_PKG"; FAILED=1
          fi
          if [ "$IOS_BUNDLE" != "com.predictxta.sports" ]; then
            echo "CRITICAL: iOS bundle ID mismatch: $IOS_BUNDLE"; FAILED=1
          fi
          echo "✓ Bundle IDs consistent: $ANDROID_PKG"

          if [ "$FAILED" -eq 1 ]; then echo "FAIL: Phase 6 checks failed."; exit 1; fi
          echo "✓ Phase 6 production hardening verified"

      # ── Phase 3 Sports Data Platform Validation ───────────────────────────
      - name: Phase 3 sports data platform checks
        run: |
          echo "Verifying Phase 3 sports data platform..."
          FAILED=0

          for sport in "'formula1'" "'afl'" "'formula-1'" "'f1'"; do
            HITS=$(grep -n "$sport" services/matchService.ts 2>/dev/null | grep -i 'supported\|type\|union' || true)
            if [ -n "$HITS" ]; then
              echo "CRITICAL: Removed sport $sport found in matchService SupportedSport: $HITS"; FAILED=1
            fi
          done

          for f in "services/providers/providerConfig.ts" \
                   "services/providers/providerTypes.ts" \
                   "supabase/migrations/0008_provider_entity_mapping.sql"; do
            if [ ! -f "$f" ]; then echo "CRITICAL: $f missing"; FAILED=1
            else echo "✓ $f present"; fi
          done

          if ! grep -q 'REMOVED_SPORTS' supabase/functions/fetch-matches/index.ts 2>/dev/null; then
            echo "CRITICAL: REMOVED_SPORTS guard missing from fetch-matches"; FAILED=1
          else
            echo "✓ REMOVED_SPORTS guard present in fetch-matches"
          fi

          if [ "$FAILED" -eq 1 ]; then echo "FAIL: Phase 3 checks failed."; exit 1; fi
          echo "✓ Phase 3 sports data platform verified"

  # ─── Stage 10: EAS Production Build (main branch only) ────────────────────
  build-production:
    name: EAS Production Build (Android AAB + iOS IPA — SDK 57, API 36)
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # ── Pre-build: validate Firebase credentials are not placeholders ────
      - name: Firebase credential check (warning mode)
        run: node scripts/validate-firebase-credentials.js
        # Add --strict flag here to hard-fail when real credentials are required.

      - name: EAS Build (production AAB — SDK 57, API 36)
        run: eas build --platform android --profile production --non-interactive --no-wait
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # ── iOS build is handled by .github/workflows/ios-testflight.yml ─────
      # Uncomment to also trigger iOS from this workflow (runs in parallel):
      # - name: EAS Build (production IPA — iOS TestFlight)
      #   run: eas build --platform ios --profile production --non-interactive --no-wait
      #   env:
      #     EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  # ─── Stage 11: EAS Update — OTA JS push (main branch only) ─────────────────
  # Publishes a JS-only update bundle to the production channel on every push
  # to main. Existing installs receive the update on next launch (ON_LOAD)
  # without requiring a new store submission or native rebuild.
  #
  # Prerequisites:
  #   • EXPO_TOKEN GitHub secret must be set
  #   • app.json updates.enabled = true (already configured)
  #   • eas.json production profile channel = "production" (already configured)
  #   • EAS project ID must be the real UUID in app.json extra.eas.projectId
  eas-update:
    name: EAS Update (OTA — production channel)
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Restore pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: EAS Update — publish OTA bundle to production channel
        run: |
          eas update \
            --channel production \
            --message "CI: $(git log -1 --pretty=format:'%s') [${GITHUB_SHA::8}]" \
            --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
